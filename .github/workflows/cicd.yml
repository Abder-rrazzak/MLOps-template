name: CI/CD MLOps

on:
  push:
    branches: ["GPU"]
  pull_request:
    branches: ["GPU"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install packages
        run: make install

      - name: Lint
        run: make lint

      - name: Format
        run: make format

      - name: Run tests
        run: make test

      - name: Check GPU
        run: make checkgpu

      - name: Deploy
        run: make deploy
